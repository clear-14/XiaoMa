[alembic]
# Path to migration scripts (relative to this file's directory)
script_location = alembic
# Allow env.py to import the app package
prepend_sys_path = .
path_separator = os
# The real URL is read from app settings (DATABASE_URL env var) in alembic/env.py; this is a placeholder only
sqlalchemy.url = sqlite:///./data/xiaoma.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
